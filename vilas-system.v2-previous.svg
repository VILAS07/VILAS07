<circle r="62" fill="#07151b" stroke="#00ff88" stroke-width="2"><animate attributeName="r" values="58;68;58" dur="2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".55;1;.55" dur="1.7s" repeatCount="indefinite"/></circle>
<circle r="82" fill="none" stroke="#7df9ff" stroke-opacity=".2"><animate attributeName="r" values="78;105;78" dur="3.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".05;.35;.05" dur="3.5s" repeatCount="indefinite"/></circle>
<circle r="115" fill="none" stroke="#00ff88" stroke-opacity=".14" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></circle>
<ellipse rx="150" ry="55" fill="none" stroke="#4b8cff" stroke-opacity=".2" stroke-dasharray="5 12"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="9s" repeatCount="indefinite"/></ellipse>
<text class="t cyan" x="-20" y="5" font-size="22">AI</text><text class="t green" x="-28" y="24" font-size="9">CORE</text>
<circle cx="115" cy="0" r="5" class="green"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="-115" cy="0" r="4" class="cyan"><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="0" cy="82" r="4" class="blue"><animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="0" cy="-82" r="3" class="green"><animateTransform attributeName="transform" type="rotate" from="270" to="630" dur="7s" repeatCount="indefinite"/></circle>
