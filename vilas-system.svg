<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<rect width="1200" height="430" rx="20" fill="#05080b" stroke="#18323a"/>
<style>.t{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.dim{fill:#71838a}.cyan{fill:#7df9ff}.green{fill:#00ff88}.white{fill:#f4f7f8}.blue{fill:#63a4ff}</style>
<!-- ambient motion -->
<g opacity=".35" fill="#7df9ff">
 <circle cx="85" cy="90" r="1.5"><animate attributeName="cy" values="90;55;90" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="470" cy="70" r="1"><animate attributeName="cx" values="470;520;470" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="760" cy="55" r="1.5"><animate attributeName="cy" values="55;85;55" dur="3.2s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="100" r="1"><animate attributeName="cx" values="1080;1125;1080" dur="4.6s" repeatCount="indefinite"/></circle>
</g>
<!-- header -->
<text class="t cyan" x="34" y="40" font-size="15">VILAS.PK</text>
<text class="t dim" x="132" y="40" font-size="12">// AI / ML ENGINEER</text>
<text class="t green" x="1050" y="40" font-size="12">● ONLINE</text>
<line x1="34" y1="58" x2="1166" y2="58" stroke="#18323a"/>
<!-- left focal system -->
<g transform="translate(300 235)">
 <circle r="48" fill="#071217" stroke="#00ff88" stroke-width="2">
  <animate attributeName="r" values="45;53;45" dur="2.2s" repeatCount="indefinite"/>
  <animate attributeName="stroke-opacity" values=".55;1;.55" dur="1.8s" repeatCount="indefinite"/>
 </circle>
 <circle r="72" fill="none" stroke="#7df9ff" stroke-opacity=".18" stroke-dasharray="2 8">
  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
 </circle>
 <ellipse rx="105" ry="48" fill="none" stroke="#63a4ff" stroke-opacity=".22" stroke-dasharray="4 10">
  <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="6s" repeatCount="indefinite"/>
 </ellipse>
 <text class="t white" x="-14" y="5" font-size="20">AI</text>
 <text class="t green" x="-20" y="21" font-size="8">CORE</text>
 <!-- orbiting dots -->
 <circle cx="72" cy="0" r="4" class="green"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite"/></circle>
 <circle cx="-72" cy="0" r="3" class="cyan"><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="4.8s" repeatCount="indefinite"/></circle>
 <circle cx="0" cy="48" r="3" class="blue"><animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="4s" repeatCount="indefinite"/></circle>
 <!-- fast data particles -->
 <circle r="2.5" class="green"><animate attributeName="cx" values="-125;-65;0;65;125" dur="2.1s" repeatCount="indefinite"/><animate attributeName="cy" values="28;14;0;-14;-28" dur="2.1s" repeatCount="indefinite"/></circle>
 <circle r="2" class="cyan"><animate attributeName="cx" values="125;65;0;-65;-125" dur="2.8s" repeatCount="indefinite"/><animate attributeName="cy" values="-28;-14;0;14;28" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
<text class="t dim" x="95" y="115" font-size="10">INPUT</text><text class="t cyan" x="95" y="132" font-size="12">IDEAS</text>
<text class="t dim" x="405" y="115" font-size="10">OUTPUT</text><text class="t green" x="405" y="132" font-size="12">IMPACT</text>
<text class="t dim" x="95" y="345" font-size="10">PROCESS</text><text class="t blue" x="95" y="362" font-size="12">LEARN</text>
<text class="t dim" x="405" y="345" font-size="10">LOOP</text><text class="t green" x="405" y="362" font-size="12">BUILD</text>
<!-- identity -->
<text class="t dim" x="555" y="112" font-size="12">$ whoami</text>
<text class="t white" x="555" y="160" font-size="46">VILAS PK<tspan class="green">_</tspan><animate attributeName="opacity" values="1;1;.2;1" dur="1.1s" repeatCount="indefinite"/></text>
<text class="t cyan" x="558" y="188" font-size="16">Building intelligent systems.</text>
<text class="t dim" x="558" y="214" font-size="12">Agents · LLMs · Computer Vision · Automation</text>
<!-- flowing capability signal -->
<line x1="555" y1="246" x2="1135" y2="246" stroke="#18323a"/>
<circle cy="246" r="3" class="green"><animate attributeName="cx" values="555;1135;555" dur="4s" repeatCount="indefinite"/></circle>
<circle cy="246" r="2" class="cyan"><animate attributeName="cx" values="1135;555;1135" dur="5.2s" repeatCount="indefinite"/></circle>
<text class="t green" x="558" y="273" font-size="12">[ AI AGENTS ]</text>
<text class="t cyan" x="690" y="273" font-size="12">[ LLMs ]</text>
<text class="t blue" x="775" y="273" font-size="12">[ VISION ]</text>
<text class="t green" x="885" y="273" font-size="12">[ AUTOMATION ]</text>
<!-- tiny live terminal -->
<rect x="555" y="300" width="580" height="78" rx="10" fill="#071015" stroke="#18323a"/>
<text class="t green" x="575" y="324" font-size="11">&gt; system.status</text>
<text class="t dim" x="575" y="347" font-size="11">agent</text><text class="t white" x="650" y="347" font-size="11">building</text><circle cx="638" cy="343" r="3" class="green"><animate attributeName="opacity" values="1;.1;1" dur=".7s" repeatCount="indefinite"/></circle>
<text class="t dim" x="760" y="347" font-size="11">vision</text><text class="t white" x="825" y="347" font-size="11">ready</text><circle cx="813" cy="343" r="3" class="cyan"><animate attributeName="opacity" values=".1;1;.1" dur="1s" repeatCount="indefinite"/></circle>
<text class="t dim" x="920" y="347" font-size="11">learning</text><text class="t green" x="1000" y="347" font-size="11">continuous</text>
<text class="t dim" x="575" y="366" font-size="10">THINK → BUILD → LEARN → REPEAT</text>
<!-- bottom pulse -->
<path d="M34 402 H260 l8 -7 8 14 8 -10 8 3 H1166" fill="none" stroke="#00ff88" stroke-opacity=".2"/>
<circle cy="402" r="3" class="green"><animate attributeName="cx" values="34;1166;34" dur="4s" repeatCount="indefinite"/></circle>
<text class="t dim" x="1030" y="418" font-size="9">LIVE // VILAS.PK</text>
</svg>