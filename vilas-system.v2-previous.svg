<text class="t muted" x="558" y="242" font-size="13">Building intelligent systems that solve real-world problems.</text>
<g class="t" font-size="12"><text x="558" y="285" class="green">[ AI AGENTS ]</text><text x="675" y="285" class="cyan">[ LLMs ]</text><text x="750" y="285" class="blue">[ COMPUTER VISION ]</text><text x="925" y="285" class="green">[ AUTOMATION ]</text><circle cx="548" cy="281" r="3" class="green"><animate attributeName="cx" values="548;1135;548" dur="4s" repeatCount="indefinite"/></circle></g>
