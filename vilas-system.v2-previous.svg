<circle r="2.5" class="cyan"><animate attributeName="cx" values="180;90;0;-90;-180" dur="3.6s" repeatCount="indefinite"/><animate attributeName="cy" values="-35;-18;0;18;35" dur="3.6s" repeatCount="indefinite"/></circle>
</g>
<g class="t" font-size="11"><text x="95" y="155" class="muted">INPUT</text><text x="95" y="171" class="cyan">IDEAS</text><text x="405" y="155" class="muted">PROCESS</text><text x="405" y="171" class="green">INTELLIGENCE</text><text x="95" y="380" class="muted">OUTPUT</text><text x="95" y="396" class="cyan">IMPACT</text><text x="405" y="380" class="muted">LOOP</text><text x="405" y="396" class="green">LEARNING</text></g>
