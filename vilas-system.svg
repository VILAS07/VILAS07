<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<rect width="1200" height="430" fill="#f4f1ea"/>
<style>
.s{font-family:Arial,Helvetica,sans-serif}.m{font-family:Georgia,'Times New Roman',serif}.ink{fill:#111111}.muted{fill:#66635d}.accent{fill:#ff4d2e}.line{stroke:#111111}.thin{stroke-width:1}
</style>
<!-- editorial grid -->
<path d="M48 42H1152M48 388H1152M48 42V388M1152 42V388" fill="none" stroke="#111" stroke-opacity=".16"/>
<path d="M405 42V388M820 42V388" fill="none" stroke="#111" stroke-opacity=".1"/>
<path d="M48 108H1152M48 316H1152" fill="none" stroke="#111" stroke-opacity=".08"/>
<!-- moving accent bars -->
<rect x="48" y="42" width="92" height="5" class="accent"><animate attributeName="width" values="92;230;92" dur="4.5s" repeatCount="indefinite"/></rect>
<rect x="1058" y="383" width="94" height="5" class="accent"><animate attributeName="x" values="1058;820;1058" dur="5s" repeatCount="indefinite"/></rect>
<!-- top label -->
<text x="50" y="76" class="s ink" font-size="11" font-weight="700" letter-spacing="2">VILAS PK / AI · ML · SYSTEMS</text>
<text x="1150" y="76" class="s muted" font-size="10" text-anchor="end">PROFILE / 2026</text>
<!-- giant editorial identity -->
<text x="48" y="190" class="m ink" font-size="104" font-weight="700">VILAS</text>
<text x="48" y="266" class="m ink" font-size="104" font-weight="700">PK<tspan class="accent">.</tspan></text>
<!-- animated underline -->
<line x1="50" y1="292" x2="360" y2="292" stroke="#ff4d2e" stroke-width="6">
 <animate attributeName="x2" values="180;360;180" dur="3.8s" repeatCount="indefinite"/>
</line>
<!-- right editorial content -->
<text x="448" y="132" class="s ink" font-size="14" font-weight="700">I BUILD SOFTWARE</text>
<text x="448" y="157" class="m ink" font-size="25">that makes complex work</text>
<text x="448" y="188" class="m ink" font-size="25">feel a little simpler.</text>
<text x="448" y="226" class="s muted" font-size="11">AI AGENTS / LLM APPLICATIONS / COMPUTER VISION</text>
<text x="448" y="247" class="s muted" font-size="11">AUTOMATION / MACHINE LEARNING / PRODUCT ENGINEERING</text>
<!-- abstract moving composition -->
<g transform="translate(980 280)">
 <rect x="-72" y="-72" width="144" height="144" fill="none" stroke="#111" stroke-width="2" transform="rotate(45)">
  <animateTransform attributeName="transform" type="rotate" values="45;135;45" dur="9s" repeatCount="indefinite"/>
 </rect>
 <circle r="42" fill="#ff4d2e">
  <animate attributeName="r" values="32;46;32" dur="2.8s" repeatCount="indefinite"/>
 </circle>
 <circle r="8" fill="#f4f1ea">
  <animate attributeName="cx" values="-28;28;-28" dur="2.1s" repeatCount="indefinite"/>
  <animate attributeName="cy" values="18;-18;18" dur="2.1s" repeatCount="indefinite"/>
 </circle>
 <circle cx="0" cy="-92" r="4" class="ink">
  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
 </circle>
</g>
<!-- numbered discipline list -->
<text x="448" y="294" class="s muted" font-size="10">01</text>
<text x="480" y="294" class="s ink" font-size="11" font-weight="700">BUILD</text>
<text x="560" y="294" class="s muted" font-size="10">02</text>
<text x="592" y="294" class="s ink" font-size="11" font-weight="700">SHIP</text>
<text x="666" y="294" class="s muted" font-size="10">03</text>
<text x="698" y="294" class="s ink" font-size="11" font-weight="700">LEARN</text>
<text x="780" y="294" class="s muted" font-size="10">04</text>
<text x="812" y="294" class="s ink" font-size="11" font-weight="700">ITERATE</text>
<!-- lower manifesto -->
<text x="48" y="348" class="m ink" font-size="17">Practical AI. Curious engineering. Real projects.</text>
<text x="48" y="370" class="s muted" font-size="10">A developer profile, not a dashboard.</text>
<text x="1150" y="370" class="s accent" font-size="10" font-weight="700" text-anchor="end">SCROLL ↓</text>
<!-- subtle moving grain-like dots -->
<g fill="#111" opacity=".35">
 <circle cx="430" cy="68" r="2"><animate attributeName="cy" values="68;82;68" dur="2.7s" repeatCount="indefinite"/></circle>
 <circle cx="850" cy="68" r="2"><animate attributeName="cy" values="82;68;82" dur="3.1s" repeatCount="indefinite"/></circle>
 <circle cx="1140" cy="125" r="2"><animate attributeName="cx" values="1140;1120;1140" dur="2.4s" repeatCount="indefinite"/></circle>
</g>
</svg>
